- id: agents
  name: '@deepseek-ai/dsh-agent'
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: feishu-records
  name: '@deepseek-ai/dsh-tool-chat-records'
  config:
    channel: feishu
    endpoint: http://bridge.invalid/read
    token: host-only-authority
    maxResultBytes: 4096
    maxPageSize: 50
    timeoutMs: 1000
  disabled: true
- id: wecom-records
  name: '@deepseek-ai/dsh-tool-chat-records'
  config:
    channel: wecom
    endpoint: http://bridge.invalid/read
    token: host-only-authority
    maxResultBytes: 4096
    maxPageSize: 50
    timeoutMs: 1000
